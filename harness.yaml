# Root scripts delegate to the workspaces; the board contract lives in packages/foundry.
install: yarn install
# foundry:compile first: the desk deploys the officer board itself at setup, so the Next
# build needs its artifact to exist.
build: yarn foundry:compile && yarn next:build
# forge test against a mock of the security token: no network.
test: yarn foundry:test
# next:dev runs `next dev` and keeps running; it inherits HEDERA_OPERATOR_ID/KEY from the harness.
serve: yarn next:dev
